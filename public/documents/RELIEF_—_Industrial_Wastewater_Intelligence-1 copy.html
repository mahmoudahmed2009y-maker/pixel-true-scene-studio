<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RELIEF — Industrial Wastewater Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8FA;--card:#fff;--navy:#163447;--navy2:#24485D;--cy:#16B8C8;--tq:#269EAA;--aqua:#DDF5F5;--tx:#193442;--tx2:#708491;--bd:#E2EAEE;--ok:#16866F;--wn:#D99535;--cr:#D9534F;box-sizing:border-box}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.h{font-family:Manrope,Inter,sans-serif}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#side{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--navy);z-index:30;transition:width .25s;overflow:hidden;padding:14px 10px;color:#cfe3ea}
#side:hover,#side.open{width:220px}.logo{display:flex;gap:12px;align-items:center;height:40px;margin-bottom:18px;white-space:nowrap;font:800 17px Manrope;color:#fff}.logo i{min-width:34px;height:34px;border-radius:10px;background:var(--cy);display:grid;place-items:center;font-style:normal}
.nav{display:flex;gap:14px;align-items:center;width:100%;height:42px;padding:0 10px;border-radius:10px;white-space:nowrap;text-align:left}.nav:hover{background:#24485D}.nav.on{background:var(--navy2);color:#fff;box-shadow:inset 3px 0 var(--cy)}.nav span{min-width:20px;text-align:center}
#top{position:sticky;top:0;z-index:20;margin-left:64px;height:58px;background:#fffd;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px}
#menu{display:none}select,.pill{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:7px 10px;font:500 13px Inter}.sp{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
main{margin-left:64px;padding:16px 20px 28px}
.sim{background:#FFF6E5;border:1px solid #F1D9A8;color:#8a5a12;border-radius:10px;padding:8px 12px;font:600 12px Inter;letter-spacing:.03em;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;background:#fff;overflow:hidden}.seg button{padding:7px 12px;font-weight:600;font-size:12px;color:var(--tx2)}.seg .on{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 1px 2px #16344708,0 6px 20px #1634470a}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.kpi small{color:var(--tx2);font-size:12px}.kpi b{display:block;font:700 22px Manrope;margin-top:4px}.kpi em{font-style:normal;font-size:12px;color:var(--tx2)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;margin-bottom:14px}
#viewcard{padding:0;position:relative;overflow:hidden;height:clamp(540px,82vh,920px)}#cv{width:100%;height:100%;display:block;touch-action:none}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:8px}#tools button,.stages button{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:7px 11px;font:600 12px Inter;box-shadow:0 2px 8px #16344712}
.stages{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.stages button{white-space:nowrap}.stages .on{background:var(--navy);color:#fff;border-color:var(--navy)}
#tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:8px;padding:5px 9px;font:600 12px Inter;display:none;z-index:5}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--tx2);font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font:600 11px Inter}.b-ok{background:#E3F4EF;color:var(--ok)}.b-wn{background:#FBEEDA;color:#9b6217}.b-cr{background:#FBE5E4;color:var(--cr)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row span{color:var(--tx2)}.row b{font-weight:600}
ul.eq{padding-left:18px;color:var(--tx2);font-size:13px;line-height:1.6}.note{background:var(--aqua);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.ch small{color:var(--tx2)}svg.sp2{width:100%;height:70px;display:block;margin-top:8px}
.al{border:1px solid var(--bd);border-left:4px solid var(--wn);border-radius:10px;padding:10px 12px;margin-top:8px}.al.acked{opacity:.55}.al button{margin-top:6px;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-weight:600;font-size:12px}
.ph{padding:60px 20px;text-align:center;color:var(--tx2)}
@media(max-width:1100px){.stage{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#side{width:0;padding:0}#side.open{width:220px;padding:14px 10px}#top,main{margin-left:0}#menu{display:block}.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.hide-m{display:none}#viewcard{height:56vh}}
select,input{color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:6px 9px;font:inherit}
#side{display:flex;flex-direction:column}#navs{flex:1;display:flex;flex-direction:column}.nav.last{margin-top:auto}
.btn{border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--card);color:var(--tx)}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn:hover{border-color:var(--cy)}
.pg{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:start;font-size:13px}.tbl th{color:var(--tx2);font-weight:600}
.mb{position:fixed;inset:0;z-index:100;background:#0b1b2699;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;padding:16px}.mb.in{opacity:1}
.md{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;transform:translateY(14px) scale(.98);transition:transform .22s;box-shadow:0 20px 60px #0004}.mb.in .md{transform:none}
.md.side{margin-inline-start:auto;height:100%;max-height:none;width:min(460px,100%)}.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}.mx{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd)}.mbd{padding:16px 18px;overflow:auto}
@media(max-width:760px){.mb{align-items:flex-end;padding:0}.md{width:100%;max-height:92vh;border-radius:18px 18px 0 0}.md.side{height:auto}}
#simov{position:absolute;left:12px;top:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:12px;display:none;box-shadow:0 2px 10px #16344722}
.rp{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:8px}.rp.on{border-color:var(--cy);background:var(--aqua)}
[data-theme=dark]{--bg:#0C1A24;--card:#13283A;--tx:#E8F1F5;--tx2:#93A9B5;--bd:#24404F;--aqua:#16414B}[data-theme=dark] #top{background:#0c1a24ee}[data-theme=dark] .pill,[data-theme=dark] .seg,[data-theme=dark] #tools button,[data-theme=dark] .stages button,[data-theme=dark] .al button{background:var(--card);color:var(--tx)}[data-theme=dark] .seg .on,[data-theme=dark] .stages .on{background:var(--cy);color:#06222a}[data-theme=dark] .b-ok{background:#12372f}[data-theme=dark] .b-wn{background:#3a2d14;color:#f0c27a}[data-theme=dark] .b-cr{background:#401f1f}[data-theme=dark] .sim{background:#3a2d14;color:#f0d29a;border-color:#5a4520}
[dir=rtl] #side{left:auto;right:0}[dir=rtl] #top,[dir=rtl] main{margin-left:0;margin-right:64px}[dir=rtl] .nav{text-align:right}[dir=rtl] .nav.on{box-shadow:inset -3px 0 var(--cy)}[dir=rtl] #tools{right:auto;left:12px}[dir=rtl] #simov{left:auto;right:12px}
@media(max-width:760px){[dir=rtl] #top,[dir=rtl] main{margin-right:0}}
</style></head><body>
<nav id="side"><div class="logo"><i>💧</i>RELIEF</div><div id="navs"></div></nav>
<header id="top"><button id="menu" aria-label="Menu">☰</button><select id="fac" aria-label="Factory"><option>Demo Factory — Line A</option><option>Demo Factory — Line B</option></select><span class="sp"></span><span class="pill hide-m" id="sys"></span><button class="pill" id="bell">🔔 <b id="nb">0</b></button><button class="pill" id="prof">👤 Operator ▾</button></header>
<main>
<div class="sim">SIMULATED DATA — NOT CONNECTED TO REAL FACTORY SENSORS.<span class="sp"></span><span class="seg" id="modes"><button data-m="normal" class="on">Normal operation</button><button data-m="clog">Filter clogging</button></span></div>
<div id="v-dash"></div><div id="v-other" class="card ph" style="display:none"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s);
const NAV=[['Dashboard','▦'],['Treatment Plant','⚙'],['Water Quality','💧'],['Equipment Monitoring','🛠'],['RELIEF Intelligence','✦'],['Reuse Assessment','♻'],['Reports','📄']];
const ST=[
{n:'Inlet & Equalization',x:-22,p:'Receive incoming wastewater and reduce fluctuations in flow and concentration.',eq:['Inlet pipe & pump','Receiving tank','Equalization tank','Flow, pH, temperature, EC/TDS sensors']},
{n:'Pre-Treatment',x:-14,p:'Remove large debris and suitable coarse materials.',eq:['Screening unit','Screen chamber','Grit-removal section (optional)']},
{n:'Primary Treatment',x:-5,p:'Separate settleable suspended solids. Coagulation/flocculation is an optional addition, not a universal stage.',eq:['Settling tank / clarifier','Inlet & outlet channels','Sludge cone & discharge pipe']},
{n:'Biological Treatment (optional)',x:3,p:'Reduce biodegradable organic load when the wastewater characteristics require it.',eq:['Biological tank','Air diffusers','Blower & air lines']},
{n:'Modular Filtration',x:13,p:'Reduce suspended particles and selected contaminants according to the installed filter media. Media is selected per pollutant profile — no single filter removes everything.',eq:['3 replaceable filter modules','Inlet & outlet manifolds','Pressure sensors, flow points','Isolation valves, backwash connection']},
{n:'Final Monitoring & Outlet',x:23,p:'Monitor treated-water characteristics to support a reuse suitability assessment.',eq:['Monitoring chamber','Sampling point','Outlet tank & pipe','Final sensors']}];
const S={mode:'normal',sel:null,acks:new Set(),c:0,h:{flow:[],dp:[],phI:[],phO:[],tur:[]},view:0};
function r(a){return (Math.random()-.5)*a}
function tick(){S.c=S.mode==='clog'?Math.min(1,S.c+.035):Math.max(0,S.c-.2);const c=S.c,h=S.h;
 const v={flow:24.8-6.2*c+r(.4),dp:.9+1.15*c+r(.04),phI:6.2+r(.1),phO:7.1+r(.05),tur:2.1+r(.2)+c*.3};
 for(const k in v){h[k].push(+v[k].toFixed(2));if(h[k].length>40)h[k].shift()}}
for(let i=0;i<40;i++)tick();
const last=a=>a[a.length-1],cur=()=>({flow:last(S.h.flow),dp:last(S.h.dp),phI:last(S.h.phI),phO:last(S.h.phO),tur:last(S.h.tur)});
function stat(i){const d=cur();if(i===4)return d.dp>2.2?2:d.dp>1.5?1:0;return 0}
function anomaly(){const f=S.h.dp,q=S.h.flow;return f[39]-f[31]>.1&&q[31]-q[39]>.6&&cur().dp>1.3}
const SN=['Normal','Attention','Critical'],SB=['b-ok','b-wn','b-cr'],SC=[0x16866F,0xD99535,0xD9534F];
function alerts(){const a=[];if(anomaly()||stat(4)>0)a.push({id:'clog',n:'Possible filter clogging',sev:'Warning',st:4,t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),ex:'Differential pressure is rising while flow is decreasing.',ac:'Inspect the filter and verify pressure and flow readings.'});return a}
function spark(a,col,min,max){const lo=min??Math.min(...a),hi=max??Math.max(...a),sp=hi-lo||1;return`<svg class="sp2" viewBox="0 0 200 70" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" points="${a.map((v,i)=>(i*200/(a.length-1)).toFixed(1)+','+(64-(v-lo)/sp*56).toFixed(1)).join(' ')}"/></svg>`}
function readings(i){const d=cur(),f=n=>n.toFixed(1);return[[['Flow rate',f(d.flow)+' m³/h'],['Inlet pH',f(d.phI)],['Temperature','28.4 °C'],['EC/TDS','1,840 µS/cm']],[['Screen Δ level','4 cm'],['Debris load','Low'],['Flow',f(d.flow)+' m³/h']],[['Turbidity (in)','186 NTU'],['Sludge blanket','0.8 m'],['Flow',f(d.flow)+' m³/h']],[['Dissolved O₂','2.1 mg/L'],['COD (lab/analyser)','640 mg/L'],['Blower','Running']],[['Flow rate',f(d.flow)+' m³/h'],['Differential pressure',d.dp.toFixed(2)+' bar'],['Modules','3 installed'],['Media','Per pollutant profile']],[['Outlet pH',f(d.phO)],['Turbidity (out)',f(d.tur)+' NTU'],['EC/TDS','1,210 µS/cm'],['Reuse','Assessment pending']]][i]}
function panel(){const i=S.sel;if(i===null)return`<h3 class="h">Stage Focus</h3><p style="color:var(--tx2);margin:8px 0">Select a stage in the 3D plant or from the list below it to see its purpose, equipment, readings and recommendations.</p><div class="note">All values are demonstration values and not universal operating thresholds. Sensor readings alone cannot prove water is safe for reuse; heavy metals and other contaminants need periodic laboratory testing.</div>`;
 const s=ST[i],st=stat(i),al=alerts().filter(a=>a.st===i);
 let ex=st?'Pressure is increasing while flow is decreasing. This pattern may indicate possible filter clogging.':'Readings are within the illustrative range for this demonstration.';
 let ac=st?'Inspect the filter and verify pressure and flow readings.':'No action required. Continue routine checks.';
 if(i===5)ex+=' Reuse suitability still requires lab verification.';
 return`<div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><small style="color:var(--tx2)">Selected stage ${i+1}/6</small><h3 class="h" style="font-size:18px">${s.n}</h3></div><span class="badge ${SB[st]}">${SN[st]}</span></div>
<p style="margin:8px 0;color:var(--tx2)">${s.p}</p><b class="h">Readings</b>${readings(i).map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
<b class="h" style="display:block;margin-top:10px">Equipment</b><ul class="eq">${s.eq.map(e=>`<li>${e}</li>`).join('')}</ul>
<div class="note"><b>${al.length?'Alert: ':'Status: '}</b>${ex}<br><b>Suggested action:</b> ${ac}</div><button id="back" style="margin-top:10px;font-weight:600;color:var(--tq)">← Back to full plant</button>`}
function build(){const d=cur(),al=alerts(),act=al.filter(a=>!S.acks.has(a.id)),an=anomaly(),dpS=stat(4);
 const kp=`<div class="kpis">
<div class="card kpi"><small>System status</small><b style="color:${dpS?'var(--wn)':'var(--ok)'}">${dpS?'Attention':'Operational'}</b><em>6 stages · 1 line</em></div>
<div class="card kpi"><small>Water flow rate</small><b>${d.flow.toFixed(1)} m³/h</b><em>${S.mode==='clog'?'Decreasing':'Stable'}</em></div>
<div class="card kpi"><small>Inlet water quality</small><b>pH ${d.phI.toFixed(1)}</b><em>Turbidity 186 NTU</em></div>
<div class="card kpi"><small>Outlet water quality</small><b>pH ${d.phO.toFixed(1)}</b><em>Turbidity ${d.tur.toFixed(1)} NTU</em></div>
<div class="card kpi"><small>Active alerts</small><b>${act.length}</b><em>${al.length-act.length} acknowledged</em></div></div>`;
 const eq=[['Inlet pump',0],['Blower',0],['Filter modules',dpS],['Sludge pump',0]];
 const chs=`<div class="grid2">
<div class="card ch"><b class="h">Water flow trend</b><small> m³/h</small>${spark(S.h.flow,'#16B8C8',15,28)}</div>
<div class="card ch"><b class="h">Differential pressure</b><small> bar</small>${spark(S.h.dp,'#D99535',.5,2.6)}</div>
<div class="card ch"><b class="h">Inlet vs outlet</b><small> pH · turbidity</small><div class="row"><span>pH</span><b>${d.phI.toFixed(1)} → ${d.phO.toFixed(1)}</b></div><div class="row"><span>Turbidity</span><b>186 → ${d.tur.toFixed(1)} NTU</b></div><div class="row"><span>EC/TDS</span><b>1,840 → 1,210 µS/cm</b></div><div class="row"><span>COD</span><b>640 → 210 mg/L*</b></div></div>
<div class="card ch"><b class="h">Equipment status</b>${eq.map(e=>`<div class="row"><span>${e[0]}</span><span class="badge ${SB[e[1]]}">${SN[e[1]]}</span></div>`).join('')}</div></div>`;
 const intel=an?`<b class="h" style="color:var(--wn)">Potential anomaly detected</b><div class="row"><span>Affected stage</span><b>Modular Filtration</b></div><p style="margin-top:8px"><b>Evidence:</b></p><ul class="eq"><li>Differential pressure is rising (${d.dp.toFixed(2)} bar).</li><li>Flow rate is decreasing (${d.flow.toFixed(1)} m³/h).</li></ul><div class="note"><b>Possible cause:</b> filter clogging.<br><b>Suggested action:</b> inspect the filter and verify sensor readings. Operator review required.</div>`:`<b class="h" style="color:var(--ok)">No anomaly detected</b><p style="color:var(--tx2);margin-top:6px">Rule-based checks on flow and differential pressure show no abnormal pattern.</p>`;
 const alh=al.length?al.map(a=>`<div class="al ${S.acks.has(a.id)?'acked':''}"><b>${a.n}</b> <span class="badge b-wn">${a.sev}</span><div style="color:var(--tx2);font-size:12px">Stage: ${ST[a.st].n} · ${a.t}</div><div style="margin-top:4px">${a.ex}</div><div style="margin-top:4px"><b>Action:</b> ${a.ac}</div>${S.acks.has(a.id)?'':`<button data-ack="${a.id}">Acknowledge</button>`}</div>`).join(''):`<p style="color:var(--tx2);margin-top:8px">No alerts.</p>`;
 return{kp,chs,intel,alh,act:act.length,dpS}}
function frame(){ // static shell once
 $('#v-dash').innerHTML=`<div id="kp"></div><div class="stage"><div class="card" id="viewcard"><canvas id="cv"></canvas><div id="tip"></div><div id="load">Loading 3D plant…</div><div id="tools"><button id="rst">Reset view</button><button id="foc">Focus stage</button></div><div class="stages" id="sl"></div></div><div class="card" id="pn" style="overflow:auto;max-height:clamp(540px,82vh,920px)"></div></div><div id="cs"></div><div class="grid3" id="bt"><div class="card" id="in"></div><div class="card"><b class="h">Alerts</b><div id="al"></div></div></div>`}
function paint(){const b=build();$('#kp').innerHTML=b.kp;$('#pn').innerHTML=panel();$('#cs').innerHTML=b.chs;$('#in').innerHTML=`<small style="color:var(--tx2)">RELIEF Intelligence · transparent rule-based logic, no trained ML model</small><div style="margin-top:6px">${b.intel}</div>`;$('#al').innerHTML=b.alh;
 $('#nb').textContent=b.act;$('#sys').innerHTML=`<span class="dot" style="background:${b.dpS?'var(--wn)':'var(--ok)'}"></span>${b.dpS?'Attention':'Operational'}`;
 $('#sl').innerHTML=ST.map((s,i)=>`<button data-s="${i}" class="${S.sel===i?'on':''}">${i+1}. ${s.n}</button>`).join('');
 [...document.querySelectorAll('[data-ack]')].forEach(e=>e.onclick=()=>{S.acks.add(e.dataset.ack);paint()});
 [...document.querySelectorAll('[data-s]')].forEach(e=>e.onclick=()=>select(+e.dataset.s));
 const bk=$('#back');if(bk)bk.onclick=()=>select(null);
 if(window.beacons)beacons.forEach((m,i)=>m.material.color.setHex(SC[stat(i)]));
 const vo=S.view===1;$('#kp').style.display=vo?'none':'';$('#cs').style.display=vo?'none':'';$('#bt').style.display=vo?'none':''}
function navInit(){$('#navs').innerHTML=NAV.map((n,i)=>`<button class="nav ${i===0?'on':''}" data-n="${i}"><span>${n[1]}</span>${n[0]}</button>`).join('');
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{const i=+b.dataset.n;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===b));
  const pl=i<2;$('#v-dash').style.display=pl?'':'none';$('#v-other').style.display=pl?'none':'';S.view=i;
  if(!pl)$('#v-other').innerHTML=`<h2 class="h" style="color:var(--tx)">${NAV[i][0]}</h2><p style="margin-top8px">This view is a placeholder in Dashboard V1. Its data is already shared through the central simulation (flow ${cur().flow.toFixed(1)} m³/h, Δp ${cur().dp.toFixed(2)} bar).</p>`;
  else{paint();setTimeout(resize,50)}$('#side').classList.remove('open')})}
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#bell').onclick=()=>{S.view=0;document.querySelector('[data-n="0"]').click();$('#al').scrollIntoView({behavior:'smooth'})};
$('#prof').onclick=()=>alert('Profile preferences (language, dark mode) will live here. Default: English, Light.');
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;S.mode=m;S.acks.clear();if(m==='normal'){S.c=0}[...$('#modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));paint()};
frame();navInit();paint();

 const fr=cur().flow/24.8,a=pts.geometry.attributes.position;for(let i=0;i<a.count;i++){const u=((i/a.count)+t*.06*fr)%1;a.setXYZ(i,-30+u*60,1.5+Math.sin(i*7)*.12,Math.cos(i*5)*.12)}a.needsUpdate=true;
 const b=pts2.geometry.attributes.position;for(let i=0;i<b.count;i++){const u=((i/b.count)+t*.05*fr)%1,x=30+u*40;let y=1.5,z=Math.cos(i*5)*.1;if(x>38){if(SIM.irr||!SIM.day&&false)z=LN[i%4]+Math.cos(i)*.08;else y=-9}b.setXYZ(i,x,y+Math.sin(i*7)*.08,z)}b.needsUpdate=true;
 beacons.forEach((m,i)=>{m.position.y=(i===4?8.8:7.6)+Math.sin(t*2+i)*.15;m.scale.setScalar(S.sel===i?1.4:1)});if(ring.visible)ring.material.opacity=.6+.3*Math.sin(t*3);
 SIM.mv+=(SIM.mt-SIM.mv)*.03;FLD.material.color.setScalar(1-.4*SIM.mv/100);poles.forEach(p=>{const h=Math.max(.1,SIM.mv/100*3);p.scale.y=h;p.position.y=h/2});R.render(SC3,CAM)}
function hd(){return 72*Math.max(1,1.6/CAM.aspect)}
function select(i){S.sel=i;if(i===null){ring.visible=false;const t=new THREE.Vector3(10,1,2);fly(t,t.clone().addScaledVector(DIR,hd()))}else{ring.visible=true;ring.position.x=ST[i].x;ring.scale.setScalar(i===6?3.2:i===4?1.5:i===2?1:.8);const t=new THREE.Vector3(ST[i].x,2,0);fly(t,t.clone().addScaledVector(DIR,i===6?50:i===4?30:24))}paint()}

 initFarm();const h=$('#bell');h.insertAdjacentHTML('beforebegin','<button class="pill" id="lg" aria-label="Language"></button><button class="pill" id="th" aria-label="Theme"></button>');

 $('#tools').insertAdjacentHTML('afterbegin','<button onclick="simModal()">Irrigation sim</button><button onclick="cfgModal()">Environment</button>');$('#viewcard').insertAdjacentHTML('beforeend','<div id="simov"></div>');
 const t=new THREE.Vector3(10,1,2);CT.target.copy(t);CAM.position.copy(t).addScaledVector(DIR,hd());CT.maxDistance=200;resize();applyCfg();
 setInterval(()=>{if([2,3,4].includes(S.view)&&!document.querySelector('.mb'))page()},1500)})();
